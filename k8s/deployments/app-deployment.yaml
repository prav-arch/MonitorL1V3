apiVersion: apps/v1
kind: Deployment
metadata:
  name: l1-monitoring
  labels:
    app: l1-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: l1-monitoring
  template:
    metadata:
      labels:
        app: l1-monitoring
    spec:
      containers:
      - name: l1-monitoring-app
        image: l1-monitoring:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        # Primary ClickHouse Database Configuration
        - name: USE_CLICKHOUSE
          value: "true"
        - name: CLICKHOUSE_HOST
          value: "clickhouse"
        - name: CLICKHOUSE_PORT
          value: "8123"
        - name: CLICKHOUSE_DB
          value: "default"
        - name: CLICKHOUSE_USER
          value: "default"
        - name: CLICKHOUSE_PASSWORD
          value: ""
        - name: CLICKHOUSE_URL
          value: "http://clickhouse:8123"
          
        # Fallback PostgreSQL Database Configuration
        - name: DATABASE_URL
          value: "postgresql://postgres:postgres@postgres:5432/postgres"
      
        # OLLAMA Configuration
        - name: OLLAMA_HOST
          value: "ollama"
        - name: OLLAMA_PORT
          value: "11434"
        - name: OLLAMA_URL
          value: "http://ollama:11434"
        - name: OLLAMA_MODEL
          value: "llama2"
      
        # App Configuration
        - name: FLASK_SECRET_KEY
          value: "your-secret-key-here"
      
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 45
          periodSeconds: 15