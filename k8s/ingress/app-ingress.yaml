apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: l1-monitoring-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: l1-monitoring.example.com  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: l1-monitoring
            port:
              number: 80