apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: l1-monitoring-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - l1-monitoring.your-domain.com
    secretName: l1-monitoring-tls
  rules:
  - host: l1-monitoring.your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: l1-monitoring-service
            port:
              number: 80