apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  # Base64 encoded values
  # echo -n "your-value" | base64
  
  # PostgreSQL (fallback database)
  DATABASE_URL: BASE64_ENCODED_DATABASE_URL
  POSTGRES_DB: BASE64_ENCODED_DB_NAME
  POSTGRES_USER: BASE64_ENCODED_DB_USER
  POSTGRES_PASSWORD: BASE64_ENCODED_DB_PASSWORD
  
  # ClickHouse (primary database)
  CLICKHOUSE_HOST: BASE64_ENCODED_CLICKHOUSE_HOST # Usually "clickhouse"
  CLICKHOUSE_PORT: BASE64_ENCODED_CLICKHOUSE_PORT # Usually "8123"
  CLICKHOUSE_DB: BASE64_ENCODED_CLICKHOUSE_DB
  CLICKHOUSE_USER: BASE64_ENCODED_CLICKHOUSE_USER
  CLICKHOUSE_PASSWORD: BASE64_ENCODED_CLICKHOUSE_PASSWORD
  CLICKHOUSE_URL: BASE64_ENCODED_CLICKHOUSE_URL # http://clickhouse:8123
  
  # OLLAMA Configuration
  OLLAMA_HOST: BASE64_ENCODED_OLLAMA_HOST # Usually "ollama"
  OLLAMA_PORT: BASE64_ENCODED_OLLAMA_PORT # Usually "11434"
  
  # App Configuration
  FLASK_SECRET_KEY: BASE64_ENCODED_FLASK_SECRET